# Path-to-label rules, read by .github/workflows/labeler.yml (actions/labeler).
# The four area labels at the top (area:ci, area:docs, area:design, area:harness)
# come from the org blueprint; the rest are specific to this repository. All
# of them already exist on GitHub with their colour and description.

"area:ci":
  - changed-files:
      - any-glob-to-any-file: [".github/**", "lefthook.yml"]

"area:docs":
  - changed-files:
      - any-glob-to-any-file: ["docs/**", "*.md", "docs.config.mjs"]

"area:design":
  - changed-files:
      - any-glob-to-any-file: ["design/**"]

"area:harness":
  - changed-files:
      - any-glob-to-any-file: [".claude/**"]

"area:hooks":
  - changed-files:
      - any-glob-to-any-file: ["hooks/**"]

"area:plugin":
  - changed-files:
      - any-glob-to-any-file: [".claude-plugin/**"]

"area:evals":
  - changed-files:
      - any-glob-to-any-file: ["evals/**"]
