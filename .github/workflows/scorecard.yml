name: Scorecard

# What this does: runs OpenSSF Scorecard, a tool that scores a repository's
# supply-chain security practices (branch protection, pinned dependencies,
# signed releases, and similar checks) and can publish a badge from the
# result. It runs weekly, on every push to the release branch, and on
# manual dispatch -- not on every PR, since supply-chain posture doesn't
# change per-commit the way tests do. It never writes to the repository's
# contents, but the analysis job holds security-events: write (to upload
# SARIF) and id-token: write (to publish results); the workflow-level
# default is read-all.
on:
  push:
    branches: [main]
  schedule:
    - cron: "30 4 * * 1" # every Monday
  workflow_dispatch:

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Required by ossf/scorecard-action's own documented minimum.
      security-events: write # to upload SARIF results
      id-token: write # to publish results and get a badge (publish_results: true)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # `publish_results: true` is what makes a README badge resolve,
          # and needs the repository to actually be public -- see this
          # pack's adoptNotes. Set this `false` for a private repository.
          publish_results: true

      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: results.sarif
