name: Dependency Review

# What this does: on every pull request into `main`, scans the dependency
# changes the PR introduces (new or updated packages) and fails if any of
# them carries a high-severity known vulnerability or a license outside the
# allowed list below. Runs GitHub's own `dependency-review-action`; nothing
# here is installed or built, so it's fast and has no build-time footprint.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: high
          # BlueOak-1.0.0, Artistic-2.0 and CC-BY-3.0 cover the dependency
          # tree of wrangler in .github/deploy-tools. All are permissive;
          # this repo never redistributes them.
          allow-licenses: MIT, MIT-0, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD, CC0-1.0, Unlicense, CC-BY-4.0, BlueOak-1.0.0, Artistic-2.0, CC-BY-3.0
          # Per-package, not per-license: wrangler pulls in sharp's prebuilt
          # libvips binaries, which carry LGPL-3.0-or-later. They are only
          # installed (--ignore-scripts) in a CI job that uploads static
          # HTML to Cloudflare, never shipped to anyone.
          # Also per-package: the pinned Claude Code CLI in .github/ci-tools
          # (verify.yml) carries Anthropic's proprietary licence. It is only
          # installed in a CI job and never redistributed.
          allow-dependencies-licenses: >-
            pkg:npm/%40anthropic-ai/claude-code,
            pkg:npm/%40anthropic-ai/claude-code-darwin-arm64,
            pkg:npm/%40anthropic-ai/claude-code-darwin-x64,
            pkg:npm/%40anthropic-ai/claude-code-linux-arm64,
            pkg:npm/%40anthropic-ai/claude-code-linux-arm64-musl,
            pkg:npm/%40anthropic-ai/claude-code-linux-x64,
            pkg:npm/%40anthropic-ai/claude-code-linux-x64-musl,
            pkg:npm/%40anthropic-ai/claude-code-win32-arm64,
            pkg:npm/%40anthropic-ai/claude-code-win32-x64,
            pkg:npm/%40img/sharp-libvips-darwin-arm64,
            pkg:npm/%40img/sharp-libvips-darwin-x64,
            pkg:npm/%40img/sharp-libvips-linux-arm,
            pkg:npm/%40img/sharp-libvips-linux-arm64,
            pkg:npm/%40img/sharp-libvips-linux-ppc64,
            pkg:npm/%40img/sharp-libvips-linux-riscv64,
            pkg:npm/%40img/sharp-libvips-linux-s390x,
            pkg:npm/%40img/sharp-libvips-linux-x64,
            pkg:npm/%40img/sharp-libvips-linuxmusl-arm64,
            pkg:npm/%40img/sharp-libvips-linuxmusl-x64,
            pkg:npm/%40img/sharp-wasm32,
            pkg:npm/%40img/sharp-win32-arm64,
            pkg:npm/%40img/sharp-win32-ia32,
            pkg:npm/%40img/sharp-win32-x64
